# Hạ tầng Edu-Knowledge Ingestion Pipeline (TÁCH RIÊNG với compose của app FastAPI).
# Executor: LocalExecutor (đủ cho MVP 1 worker). Metadata DB dùng Postgres RIÊNG (không đụng Neon).
#
# Khởi chạy:
#   cd pipelines/airflow
#   cp .env.airflow.example .env.airflow   # rồi điền key
#   docker compose -f docker-compose.airflow.yml --env-file .env.airflow up -d --build
#
# UI: Airflow http://localhost:8080 (airflow/airflow) · MinIO http://localhost:9001 · Qdrant http://localhost:6333/dashboard

x-airflow-common: &airflow-common
  build:
    context: .
    dockerfile: Dockerfile.worker
  environment: &airflow-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres-airflow:5432/airflow
    AIRFLOW__API__AUTH_BACKENDS: airflow.api.auth.backend.basic_auth
    AIRFLOW__WEBSERVER__EXPOSE_CONFIG: "true"
    # ---- Connections & Variables (đọc bởi plugins/edu_pipeline/config.py) ----
    AIRFLOW_CONN_AWS_MINIO: ${AIRFLOW_CONN_AWS_MINIO}
    AIRFLOW_CONN_SLACK_ALERTS: ${AIRFLOW_CONN_SLACK_ALERTS}
    AIRFLOW_VAR_DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY}
    AIRFLOW_VAR_DEEPSEEK_API_BASE: ${DEEPSEEK_API_BASE:-https://api.deepseek.com}
    AIRFLOW_VAR_DEEPSEEK_MODEL: ${DEEPSEEK_MODEL:-deepseek-chat}
    AIRFLOW_VAR_OPENAI_API_KEY: ${OPENAI_API_KEY}
    AIRFLOW_VAR_EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-openai}
    AIRFLOW_VAR_EMBEDDING_MODEL: ${EMBEDDING_MODEL:-text-embedding-3-small}
    AIRFLOW_VAR_GEMINI_EMBED_MODEL: ${GEMINI_EMBED_MODEL:-gemini-embedding-001}
    AIRFLOW_VAR_LOCAL_EMBED_MODEL: ${LOCAL_EMBED_MODEL:-BAAI/bge-m3}
    AIRFLOW_VAR_EMBEDDING_DIM: ${EMBEDDING_DIM:-}
    # Cache HuggingFace để model BGE-m3 chỉ tải 1 lần (bền qua rebuild nhờ volume).
    HF_HOME: /opt/airflow/hf_cache
    AIRFLOW_VAR_VISION_MODEL: ${VISION_MODEL:-gpt-4o}
    AIRFLOW_VAR_VISION_PROVIDER: ${VISION_PROVIDER:-openai}
    AIRFLOW_VAR_GEMINI_API_KEY: ${GEMINI_API_KEY:-}
    AIRFLOW_VAR_GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.0-flash}
    AIRFLOW_VAR_QWEN_API_KEY: ${QWEN_API_KEY:-}
    AIRFLOW_VAR_QWEN_MODEL: ${QWEN_MODEL:-qwen3-vl-flash}
    AIRFLOW_VAR_QWEN_API_BASE: ${QWEN_API_BASE:-https://dashscope-intl.aliyuncs.com/compatible-mode/v1}
    AIRFLOW_VAR_OCR_LANG: ${OCR_LANG:-vie}
    AIRFLOW_VAR_QDRANT_URL: ${QDRANT_URL:-http://qdrant:6333}
    AIRFLOW_VAR_QDRANT_API_KEY: ${QDRANT_API_KEY:-}
    AIRFLOW_VAR_QDRANT_COLLECTION: ${QDRANT_COLLECTION:-edu_knowledge}
    AIRFLOW_VAR_MINIO_BUCKET: ${MINIO_BUCKET:-edu-knowledge}
    AIRFLOW_VAR_CHUNK_TOKEN_SIZE: ${CHUNK_TOKEN_SIZE:-3000}
  volumes:
    - ./dags:/opt/airflow/dags
    - ./plugins:/opt/airflow/plugins
    - ./logs:/opt/airflow/logs
    - hf-cache:/opt/airflow/hf_cache
  depends_on:
    postgres-airflow:
      condition: service_healthy

services:
  postgres-airflow:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - airflow-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 10s
      retries: 5
    restart: unless-stopped

  airflow-init:
    <<: *airflow-common
    entrypoint: /bin/bash
    command:
      - -c
      - |
        airflow db migrate
        airflow users create --username airflow --password airflow \
          --firstname Admin --lastname User --role Admin --email admin@example.com || true
        airflow pools set deepseek_pool 5 "Giới hạn concurrency gọi DeepSeek API"
    restart: on-failure

  airflow-webserver:
    <<: *airflow-common
    command: webserver
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 30s
      retries: 5
    restart: unless-stopped
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    restart: unless-stopped
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      retries: 5
    restart: unless-stopped

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${MINIO_ROOT_USER:-minioadmin} ${MINIO_ROOT_PASSWORD:-minioadmin};
      mc mb -p local/${MINIO_BUCKET:-edu-knowledge};
      exit 0;
      "

  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant-data:/qdrant/storage
    restart: unless-stopped

volumes:
  airflow-db:
  minio-data:
  qdrant-data:
  hf-cache:
