    // =========================================================================
    // SLIDE NAVIGATION & INTERACTIVITY
    // =========================================================================
    function updateSlide() {
      const slide = slides[currentSlide];
      document.getElementById('header-title').innerText = slide.title;
      document.getElementById('header-subtitle').innerText = slide.subtitle;
      document.getElementById('slide-counter-badge').innerText = `${currentSlide + 1} / ${slides.length}`;
      document.getElementById('slide-counter-footer').innerText = `Slide ${currentSlide + 1} / ${slides.length}`;

      // Update Slide Content
      const container = document.getElementById('slide-container');
      if (slide.type === 'report_01') {
        container.className = 'w-full h-full mx-auto flex items-center justify-center max-w-none px-0';
      } else {
        container.className = 'w-full h-full mx-auto flex items-center justify-center max-w-6xl 2xl:max-w-7xl';
      }
      container.innerHTML = slide.render();

      // Update Progress Dots
      const dotsContainer = document.getElementById('progress-dots');
      dotsContainer.innerHTML = slides.map((_, idx) => `
        <button type="button" onclick="goToSlide(${idx})" class="h-1 rounded-full transition-all duration-300 ${idx === currentSlide
          ? 'w-6 bg-vsf-gold dark:bg-vsf-goldLight'
          : 'w-1.5 bg-vsf-lightBorder dark:bg-vsf-darkBorder hover:bg-slate-400'
        }" title="Chuyển tới slide ${idx + 1}"></button>
      `).join('');

      // Update buttons disabled state
      document.getElementById('btn-prev').disabled = currentSlide === 0;
      document.getElementById('btn-next').disabled = currentSlide === slides.length - 1;

      // Re-initialize Lucide icons
      lucide.createIcons();
    }

    function goToSlide(idx) {
      currentSlide = Math.max(0, Math.min(idx, slides.length - 1));
      updateSlide();
    }

    function nextSlide() {
      if (currentSlide < slides.length - 1) {
        currentSlide++;
        updateSlide();
      }
    }

    function prevSlide() {
      if (currentSlide > 0) {
        currentSlide--;
        updateSlide();
      }
    }

    function selectFlow(flowIdx) {
      activeFlow = flowIdx;
      if (slides[currentSlide].type === 'report_01') {
        document.getElementById('slide-container').innerHTML = renderSolutionDiagram();
        lucide.createIcons();
      }
    }

    function toggleTheme() {
      const html = document.documentElement;
      const isDark = html.classList.toggle('dark');
      const icon = document.getElementById('theme-icon');
      if (isDark) {
        icon.setAttribute('data-lucide', 'sun');
      } else {
        icon.setAttribute('data-lucide', 'moon');
      }
      updateSlide();
    }

    // Keyboard Shortcuts
    window.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowRight' || e.key === ' ') {
        e.preventDefault();
        nextSlide();
      } else if (e.key === 'ArrowLeft') {
        e.preventDefault();
        prevSlide();
      } else if (e.key.toLowerCase() === 't') {
        toggleTheme();
      }
    });

    // Initialize on load
    window.addEventListener('DOMContentLoaded', () => {
      updateSlide();
    });
  </script>
